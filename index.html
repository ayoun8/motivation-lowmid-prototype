<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Pet + Peer Support</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f3f3;color:#222;font:17px Arial,Helvetica,sans-serif}header{background:white;border-bottom:1px solid #aaa;padding:20px max(24px,calc((100% - 1000px)/2));display:flex;justify-content:space-between;align-items:center;gap:20px}header strong{font-size:21px}small{display:block;color:#666;margin-top:6px}.banner{text-align:center;font-size:14px;padding:12px;background:#e4e4e4}main{max-width:1000px;margin:24px auto;padding:0 24px 40px}nav{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px;font-size:14px;color:#666}nav span{padding:10px;border-bottom:2px solid #ccc}nav .active{border-color:#333;color:#222;font-weight:bold}article{background:white;border:1.5px solid #999;padding:32px;min-height:430px}h1{font-size:32px;margin:12px 0 18px}h2{font-size:23px}p{line-height:1.55}.eyebrow{text-transform:uppercase;color:#666;font-size:14px;letter-spacing:.06em}.columns{display:grid;grid-template-columns:1fr 220px;gap:30px;align-items:center}.pet{width:180px;height:160px;border:2px dashed #777;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;margin:auto;background:#fff;text-align:center;padding:18px;font:16px monospace}.pet.review{background:#ddd;border-style:solid}.pet.reward{border-style:double;border-width:4px}.pet strong{font-size:18px}.petnote{text-align:center;font-size:15px}.box,.message{border:1px solid #aaa;padding:20px;background:#fafafa;margin:20px 0}.message strong{display:block;font-size:14px;margin-bottom:10px}.mine{margin-left:35px;background:white}.status{padding:16px;background:#eee;border-left:4px solid #555;line-height:1.6}button,input,textarea{font:inherit}button{min-height:48px;border:1.5px solid #555;background:#eee;color:#222;padding:13px 19px;border-radius:0;cursor:pointer}button:hover{background:#ddd}button.primary{background:#333;color:white}button.primary:hover{background:#555}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #333;outline-offset:3px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}.choice{display:flex;align-items:center;gap:14px;min-height:58px;border:1px solid #999;margin:12px 0;padding:16px;background:white;cursor:pointer}.choice:has(input:checked){background:#eee;outline:1px solid #333}.choice input{width:22px;height:22px;accent-color:#333}.error{color:#222;font-weight:bold;min-height:24px}textarea{width:100%;min-height:110px;display:block;padding:12px;border:1px solid #777;margin-top:10px}.note{font-size:14px;color:#666;line-height:1.5}footer{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:20px}details{font-size:14px;line-height:1.6;margin-top:25px}summary{cursor:pointer}dialog{max-width:460px;border:1px solid #555;padding:28px}dialog::backdrop{background:#0006}[hidden]{display:none!important}@media(max-width:650px){header{padding:16px}header strong{font-size:17px}main{padding:0 14px 30px}article{padding:22px}h1{font-size:27px}.columns{grid-template-columns:1fr}.pet{width:150px;height:150px}.actions button{flex:1}.mine{margin-left:15px}}
</style><body><header><div><strong>Study companion</strong></div><button id="reset">Reset practice</button></header><main><nav id="progress" aria-label="Activity progress"></nav><article id="app" aria-live="polite"></article><footer><button id="exit" hidden>Back to study set</button></footer></main><dialog id="confirm"><h2>Reset this practice?</h2><p>Your answers, conversation, and completion star will be cleared.</p><div class="actions"><button id="keep">Keep practicing</button><button id="do-reset" class="primary">Reset practice</button></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id),app=$('app');
const fresh=()=>({screen:'set',resumeScreen:null,first:null,answer:null,needsReview:false,star:0,reasoning:'',sent:false,peer:false,reply:false,passed:false});let state=fresh();
const names={set:'Study set',practice:'Practice card',flag:'Concept feedback',waiting:'Request sent',peer:'Peer guidance',independent:'Independent practice',check:'Practice feedback',reward:'Reward and progress'};
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function pet(kind='',label='Your study companion'){const status=kind==='review'?'Ear shaded: review needed':kind==='reward'?'Completion star earned':'Ready to practice';return `<aside><div class="pet ${kind}" role="img" aria-label="Pet placeholder: ${status}"><strong>[ PET ]</strong><span>${status}</span></div><p class="petnote">${label}</p></aside>`}
function button(t,id,primary=true){return `<button id="${id}" class="${primary?'primary':''}">${t}</button>`}
function choices(name,selected){return ['Mitosis','Meiosis'].map(a=>`<label class="choice"><input type="radio" name="${name}" value="${a}" ${selected===a?'checked':''}>${a}</label>`).join('')}
function on(id,fn){if($(id))$(id).addEventListener('click',fn)}function go(s){state.screen=s;render()}function error(t){$('error').textContent=t}function ask(){state.peer=true;go(state.reply?'peer':'waiting')}
function render(){const s=state.screen,step=['set','practice'].includes(s)?0:['flag','waiting','peer'].includes(s)?1:['check','independent'].includes(s)?2:3;
$('progress').innerHTML=['Practice','Peer support','Independent check','Reward'].map((t,i)=>`<span class="${step===i?'active':''}" ${step===i?'aria-current="step"':''}>${i+1}. ${t}</span>`).join('');$('exit').hidden=s==='set'||s==='reward';
if(s==='set'){app.innerHTML=`<div class="eyebrow">Your study set</div><h1 tabindex="-1">Biology: Cell division</h1><p>Practice with your pet. Get a peer’s guidance when a concept is difficult.</p><div class="columns"><div><h2>One short study activity</h2><p>Answer a flashcard, get support if needed, then apply the idea in a new question.</p><div class="box"><strong>Session progress</strong><p>${state.star?'Complete · One completion star earned. You can practice this activity again below.':state.needsReview?'In progress · Mitosis needs review.':'Ready to start · No rewards earned yet.'}</p></div><div class="actions">${state.star?button('Practice again','again')+button('View reward','view',false):state.resumeScreen?button('Resume practice','resume'):button('Start practice','start')}</div></div>${pet(state.star?'reward':state.needsReview?'review':'',state.needsReview?'Shaded ear: <strong>Mitosis needs review.</strong>':'Let’s take it one concept at a time.')}</div>`;on('start',()=>go('practice'));on('again',()=>{state=fresh();go('practice')});on('view',()=>go('reward'));on('resume',()=>go(state.resumeScreen||'practice'))}
else if(s==='practice'){app.innerHTML=`<div class="eyebrow">Practice · Card 1 of 1</div><h1 tabindex="-1">Try this from memory</h1><p>Select one answer, then submit.</p><fieldset class="box"><legend>Which process makes two genetically identical daughter cells?</legend>${choices('first',state.first)}</fieldset><p class="error" id="error" role="alert"></p><div class="actions">${button('Submit answer','submit')}</div>`;on('submit',()=>{const a=app.querySelector('input:checked');if(!a)return error('Choose an answer before submitting.');state.first=a.value;state.needsReview=a.value!=='Mitosis';go('flag')})}
else if(s==='flag'){app.innerHTML=`<div class="eyebrow">Practice feedback</div><h1 tabindex="-1">${state.needsReview?'Mitosis needs review':'Correct: Mitosis'}</h1><div class="columns"><div><p>${state.needsReview?`You selected <strong>${escape(state.answer||state.first||'Meiosis')}</strong>. That answer needs another look. The shaded ear flags this topic.`:'Mitosis makes two genetically identical daughter cells. Try applying the idea to a new situation.'}</p><div class="status">${state.needsReview?'Shaded ear: <strong>Mitosis needs review.</strong> The text label explains the review marker.':'One correct answer is a useful step. The next question checks whether you can apply the idea.'}</div><div class="actions">${state.needsReview?button('Request a peer hint','ask'):button('Try a new question','new')}${!state.needsReview?button('Ask a peer anyway','ask',false):''}</div></div>${pet(state.needsReview?'review':'',state.needsReview?'A classmate can help you think it through.':'Ready for another question?')}</div>`;on('ask',ask);on('new',()=>{state.answer=null;go('independent')})}
else if(s==='waiting'){app.innerHTML=`<div class="eyebrow">Peer support</div><h1 tabindex="-1">Hint requested</h1><p>Alex is a classmate who understands cell division.</p><div class="message mine"><strong>You → Alex</strong>Can you help me distinguish these processes?</div><div class="status">Alex’s reply is ready.</div><div class="actions">${button('Open peer reply','open')}${button('Cancel request','cancel',false)}</div>`;on('open',()=>{state.reply=true;go('peer')});on('cancel',()=>go('flag'))}
else if(s==='peer'){app.innerHTML=`<div class="eyebrow">Peer guidance</div><h1 tabindex="-1">Think it through with Alex</h1><p>Alex offers guidance so you can work out the idea.</p><div class="message"><strong>Alex · Knowledgeable classmate</strong>Think about growth and repair. When replacing a skin cell, should the new cells keep the same chromosome number or have half as many?</div>${state.sent?`<div class="message mine"><strong>You</strong>${escape(state.reasoning)}</div><div class="message"><strong>Alex · Classmate</strong>Compare your explanation with the goal of replacing a body cell. Now try a new question on your own and think about why your choice fits.</div><div class="actions">${button('Try on my own','own')}</div>`:`<label for="reasoning"><strong>Explain what you think</strong></label><textarea id="reasoning" maxlength="500" placeholder="For repairing the body, I think the new cells should…">${escape(state.reasoning)}</textarea><p class="error" id="error" role="alert"></p><div class="actions">${button('Send reasoning','send')}</div>`}`;on('send',()=>{const t=$('reasoning').value.trim();if(!t)return error('Add a short explanation before sending.');state.reasoning=t;state.sent=true;render()});on('own',()=>{state.answer=null;go('independent')})}
else if(s==='independent'){app.innerHTML=`<div class="eyebrow">Independent practice · New question</div><h1 tabindex="-1">Try without the hint</h1><p>Alex’s guidance is hidden here. Choose the process that fits this situation.</p><fieldset class="box"><legend>A skin cell divides to repair a cut. Which process keeps chromosome number unchanged?</legend>${choices('answer',state.answer)}</fieldset><p class="error" id="error" role="alert"></p><div class="actions">${button('Submit answer','check')}${button('Need a hint?','hint',false)}</div>`;on('check',()=>{const a=app.querySelector('input:checked');if(!a)return error('Choose an answer before submitting.');state.answer=a.value;state.passed=a.value==='Mitosis';state.needsReview=!state.passed;go('check')});on('hint',()=>{const a=app.querySelector('input:checked');state.answer=a?a.value:null;ask()})}
else if(s==='check'){app.innerHTML=`<div class="eyebrow">Independent practice · Feedback</div><h1 tabindex="-1">${state.passed?'Practice check passed':'Let’s review this again'}</h1><div class="columns"><div><p>${state.passed?'<strong>Mitosis is correct.</strong> Body cells divide through mitosis for growth and repair, keeping chromosome number unchanged.':'You selected <strong>Meiosis</strong>. Meiosis reduces chromosome number to form reproductive cells. That does not fit skin repair.'}</p><div class="status">${state.passed?'Your pet’s review marker is cleared for Mitosis.':'Shaded ear: <strong>Mitosis needs review.</strong> Retry or revisit the peer guidance.'}</div><div class="actions">${state.passed?button('Finish practice','finish'):button('Try again','retry')}${!state.passed?button('Get peer guidance','hint',false):''}</div></div>${pet(state.passed?'':'review',state.passed?'Nice work applying the idea.':'We can take another look together.')}</div>`;on('retry',()=>{state.answer=null;go('independent')});on('hint',ask);on('finish',()=>{if(state.passed){state.star=1;go('reward')}})}
else if(s==='reward'){app.innerHTML=`<div class="eyebrow">Reward and progress</div><h1 tabindex="-1">Practice complete</h1><div class="columns"><div><h2>One completion star for your pet</h2><p>You completed the Biology activity${state.peer?' with peer support followed by a practice check':''}.</p><div class="box"><strong>Session summary</strong><p>Completion stars: <strong>1</strong><br>Independent check: <strong>Passed</strong><br>Topic: <strong>Mitosis</strong></p></div><div class="actions">${button('Back to study set','back')}</div></div>${pet('reward','Your companion earned a completion reward.')}</div>`;on('back',backToSet)}
const h=app.querySelector('h1');if(h)h.focus({preventScroll:true})}
function backToSet(){state.resumeScreen=state.star?null:state.screen;const draft=$('reasoning');if(draft)state.reasoning=draft.value;const selected=app.querySelector('input:checked');if(selected){if(state.screen==='practice')state.first=selected.value;if(state.screen==='independent')state.answer=selected.value;}go('set')}
$('exit').addEventListener('click',backToSet);$('reset').addEventListener('click',()=>$('confirm').showModal());$('keep').addEventListener('click',()=>$('confirm').close());$('do-reset').addEventListener('click',()=>{$('confirm').close();state=fresh();render()});render();
</script></body></html>
